<!DOCTYPE html>
<html>
<head>
    <title>Mandala Builder</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="app-header">
    <div>
        <h1>Mandala Builder</h1>
        <p>Create layered geometric mandalas with editable rings, color, glow, and export.</p>
    </div>
</header>

<div class="container">

    <div class="sidebar">

        <h2>Patterns</h2>

        <div class="style-controls">
            <label for="colorPicker">Color</label>
            <input id="colorPicker" type="color" value="#00ffff">

            <label for="backgroundPicker">Canvas color</label>
            <input id="backgroundPicker" type="color" value="#000000">

            <label class="checkbox-control">
                <input id="fillToggle" type="checkbox">
                Fill shapes
            </label>

            <label class="checkbox-control">
                <input id="glowToggle" type="checkbox">
                Glow
            </label>
        </div>

        <div class="motif-grid">
            <button class="motif-button" onclick="addRing('circle')" title="Circle"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="12"/></svg><span>Circle</span></button>
            <button class="motif-button" onclick="addRing('triangle')" title="Triangle"><svg viewBox="0 0 48 48"><path d="M24 10 L38 36 L10 36 Z"/></svg><span>Triangle</span></button>
            <button class="motif-button" onclick="addRing('diamond')" title="Diamond"><svg viewBox="0 0 48 48"><path d="M24 8 L38 24 L24 40 L10 24 Z"/></svg><span>Diamond</span></button>
            <button class="motif-button" onclick="addRing('dot')" title="Dot"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="5"/></svg><span>Dot</span></button>
            <button class="motif-button" onclick="addRing('leaf')" title="Leaf"><svg viewBox="0 0 48 48"><ellipse cx="24" cy="24" rx="8" ry="17"/></svg><span>Leaf</span></button>
            <button class="motif-button" onclick="addRing('long-petal')" title="Long Drop"><svg viewBox="0 0 48 48"><path d="M5 24 C15 10 33 10 43 24 C33 38 15 38 5 24 Z"/></svg><span>Long</span></button>
            <button class="motif-button" onclick="addRing('pointed-petal')" title="Pointed Petal"><svg viewBox="0 0 48 48"><path d="M24 7 C39 20 35 37 24 41 C13 37 9 20 24 7 Z"/></svg><span>Pointed</span></button>
            <button class="motif-button" onclick="addRing('teardrop')" title="Drop Petal"><svg viewBox="0 0 48 48"><path d="M24 6 C38 20 35 40 24 40 C13 40 10 20 24 6 Z"/></svg><span>Drop</span></button>
            <button class="motif-button" onclick="addRing('star')" title="Star"><svg viewBox="0 0 48 48"><path d="M24 7 L28 19 L41 19 L30 27 L34 40 L24 32 L14 40 L18 27 L7 19 L20 19 Z"/></svg><span>Star</span></button>
            <button class="motif-button" onclick="addRing('line-sprout')" title="Lines"><svg viewBox="0 0 48 48"><path d="M12 38 V18 M24 38 V10 M36 38 V20"/><circle cx="12" cy="18" r="2"/><circle cx="24" cy="10" r="2"/><circle cx="36" cy="20" r="2"/></svg><span>Lines</span></button>
            <button class="motif-button" onclick="addRing('dot-line')" title="Dot Line"><svg viewBox="0 0 48 48"><path d="M8 24 H40"/><circle cx="14" cy="24" r="3"/><circle cx="24" cy="24" r="3"/><circle cx="34" cy="24" r="3"/></svg><span>Dotline</span></button>
            <button class="motif-button" onclick="addRing('arch')" title="Arch"><svg viewBox="0 0 48 48"><path d="M9 34 Q24 8 39 34"/></svg><span>Arch</span></button>
            <button class="motif-button" onclick="addRing('small-arch')" title="Scallop"><svg viewBox="0 0 48 48"><path d="M4 35 C6 17 18 17 20 35 C22 16 34 16 36 35 C38 18 44 18 46 35"/></svg><span>Scallop</span></button>
            <button class="motif-button" onclick="addRing('spike')" title="Spike"><svg viewBox="0 0 48 48"><path d="M12 36 L24 8 L36 36"/></svg><span>Spike</span></button>
            <button class="motif-button" onclick="addRing('wave')" title="Wave"><svg viewBox="0 0 48 48"><path d="M4 28 C11 15 18 15 24 28 C30 41 39 41 46 28"/></svg><span>Wave</span></button>
            <button class="motif-button" onclick="addRing('arc-band')" title="Arc Band"><svg viewBox="0 0 48 48"><path d="M8 36 Q24 8 40 36 M14 36 Q24 18 34 36"/></svg><span>Arc</span></button>
            <button class="motif-button" onclick="addRing('swirl')" title="Swirl"><svg viewBox="0 0 48 48"><path d="M14 26 C14 12 36 12 36 25 C36 36 20 35 20 25 C20 18 30 18 30 24"/></svg><span>Swirl</span></button>
            <button class="motif-button" onclick="addRing('spiral')" title="Spiral"><svg viewBox="0 0 48 48"><path d="M6 29 C13 7 42 8 43 26 C44 42 18 42 18 27 C18 17 32 17 32 26"/></svg><span>Spiral</span></button>
            <button class="motif-button" onclick="addRing('cluster')" title="Cluster"><svg viewBox="0 0 48 48"><circle cx="18" cy="29" r="7"/><circle cx="30" cy="29" r="7"/><circle cx="24" cy="17" r="7"/></svg><span>Cluster</span></button>
            <button class="motif-button" onclick="addRing('bead-link')" title="Bead Link"><svg viewBox="0 0 48 48"><path d="M14 24 H34"/><circle cx="12" cy="24" r="6"/><circle cx="36" cy="24" r="6"/></svg><span>Beads</span></button>
            <button class="motif-button" onclick="addRing('chevron')" title="Chevron"><svg viewBox="0 0 48 48"><path d="M10 18 L24 32 L38 18"/></svg><span>Chevron</span></button>
            <button class="motif-button" onclick="addRing('hatch-triangle')" title="Hatched Triangle"><svg viewBox="0 0 48 48"><path d="M24 9 L40 38 L8 38 Z M18 38 L31 21 M27 38 L36 30"/></svg><span>Hatch</span></button>
            <button class="motif-button" onclick="addRing('stripe-block')" title="Stripe Block"><svg viewBox="0 0 48 48"><rect x="10" y="12" width="28" height="24"/><path d="M18 12 V36 M26 12 V36 M34 12 V36"/></svg><span>Stripe</span></button>
            <button class="motif-button" onclick="addRing('crescent')" title="Crescent"><svg viewBox="0 0 48 48"><path d="M31 9 C17 13 14 34 30 39 C17 39 8 31 8 24 C8 15 17 8 31 9 Z"/></svg><span>Crescent</span></button>
            <button class="motif-button" onclick="addRing('eye')" title="Eye"><svg viewBox="0 0 48 48"><path d="M8 24 Q24 9 40 24 Q24 39 8 24 Z"/><circle cx="24" cy="24" r="4"/></svg><span>Eye</span></button>
            <button class="motif-button" onclick="addRing('ring-dot')" title="Ring Dot"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="13"/><circle cx="24" cy="24" r="4"/></svg><span>Ring</span></button>
            <button class="motif-button" onclick="addRing('sunburst')" title="Sunburst"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="5"/><path d="M24 6 V14 M24 34 V42 M6 24 H14 M34 24 H42 M11 11 L17 17 M31 31 L37 37 M37 11 L31 17 M17 31 L11 37"/></svg><span>Sun</span></button>
        </div>

        <div class="special-actions">
            <button onclick="addCenterDot()">Center Dot</button>
            <button onclick="addBoundary()">Single Boundary</button>
            <button onclick="addDoubleBoundary()">Double Boundary</button>
        </div>

    </div>

    <div class="canvas-container">

        <svg
            id="mandala"
            width="800"
            height="800"
            viewBox="0 0 800 800">
        </svg>

    </div>

    <div class="tools-panel">

        <h2>Edit</h2>

        <div class="icon-tools">
            <button class="icon-button" onclick="eraseLast()" aria-label="Manual eraser" title="Manual eraser">
                &#9003;
            </button>

            <button class="icon-button" onclick="toggleReverse()" aria-label="Undo" title="Undo">
                &#8630;
            </button>

            <button class="icon-button" onclick="toggleInverse()" aria-label="Redo" title="Redo">
                &#8631;
            </button>

            <button class="icon-button" onclick="toggleInvertElement()" aria-label="Invert element" title="Invert element">
                &#9680;
            </button>

            <button class="icon-button" onclick="downloadArtwork()" aria-label="Download JPG" title="Download JPG">
                &#8681;
            </button>

            <button class="icon-button" onclick="resetCanvas()" aria-label="Reset canvas" title="Reset canvas">
                &#8634;
            </button>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
